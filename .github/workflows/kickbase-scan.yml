name: Kickbase scan

on:
  schedule:
    # 07:00 and 19:00 UTC = 09:00 and 21:00 Europe/Berlin (CEST, UTC+2)
    - cron: "0 7 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r fetch/requirements.txt

      - name: Run Kickbase scan
        env:
          KICK_EMAIL: ${{ secrets.KICK_EMAIL }}
          KICK_PASSWORD: ${{ secrets.KICK_PASSWORD }}
        run: python fetch/main.py

      - name: Commit results
        run: |
          git config user.name "kickbase-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "Update Kickbase scan results [skip ci]"
          git push
